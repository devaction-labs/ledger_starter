# Sincroniza os secrets e as variaveis do GitHub (repositorio) com o ambiente de
# producao do Openship e redeploya a versao que ja esta no ar, porque o container
# so le a env quando sobe.
#
# Dois gatilhos:
#   - PR mergeado com o label `deploy-secrets` (`pull_request_target`: roda o workflow da main,
#     com ref refs/heads/main): o job comenta no PR quais chaves
#     foram aplicadas (so os nomes).
#   - workflow_dispatch: para trocar uma chave sem PR (ex.: rotacao).
#
# O Openship mascara os valores na leitura, entao a fonte da verdade e' o
# GitHub. DATABASE_URL nao e sincronizado: o Openship injeta pela conexao do banco.
#
# A lista de nomes esta em dois lugares que precisam andar juntos: o bloco
# `env:` do step abaixo e `SECRET_NAMES` e `OPTIONAL_VAR_NAMES` em `.github/scripts/openship-sync-secrets.sh`.
name: Sync secrets

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_version:
        description: "Tag a redeployar depois do sync (ex.: v0.14.2). Vazio = sha-<sha da main> (o que o main.yml publica)."
        required: false
        type: string

concurrency:
  group: sync-secrets
  cancel-in-progress: false

jobs:
  sync:
    name: Sync secrets to Openship
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'deploy-secrets')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve the version to redeploy
        id: version
        env:
          INPUT_VERSION: ${{ inputs.image_version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="sha-$(git rev-parse origin/main)"
          fi
          echo "image_version=$version" >> "$GITHUB_OUTPUT"
          echo "redeploying $version"

      - name: Store the secrets and variables in Openship
        env:
          OPENSHIP_API_URL: ${{ secrets.OPENSHIP_CLOUD_API_URL }}
          OPENSHIP_API_TOKEN: ${{ secrets.OPENSHIP_CLOUD_API_TOKEN }}
          OPENSHIP_PROJECT_ID: ${{ secrets.OPENSHIP_CLOUD_PROJECT_ID }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          PHX_HOST: ${{ vars.PHX_HOST }}
          BASE_HOST: ${{ vars.BASE_HOST }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          POOL_SIZE: ${{ vars.POOL_SIZE }}
        run: bash .github/scripts/openship-sync-secrets.sh

      - name: Redeploy so the container picks the new env up
        env:
          OPENSHIP_API_URL: ${{ secrets.OPENSHIP_CLOUD_API_URL }}
          OPENSHIP_API_TOKEN: ${{ secrets.OPENSHIP_CLOUD_API_TOKEN }}
          OPENSHIP_PROJECT_ID: ${{ secrets.OPENSHIP_CLOUD_PROJECT_ID }}
          IMAGE_VERSION: ${{ steps.version.outputs.image_version }}
        run: bash .github/scripts/openship-deploy.sh

      - name: Tell the PR which secrets were applied
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IMAGE_VERSION: ${{ steps.version.outputs.image_version }}
        run: |
          names=$(sed -n '/^SECRET_NAMES=(/,/^)/p;/^OPTIONAL_VAR_NAMES=(/,/^)/p' .github/scripts/openship-sync-secrets.sh | grep -vE '^(SECRET_NAMES|OPTIONAL_VAR_NAMES)=|^\)' | tr -d ' ' | paste -sd, -)
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Secrets aplicados no Openship e producao redeployada em ${IMAGE_VERSION}: ${names}"
